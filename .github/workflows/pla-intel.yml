name: pla-intel
# Every ~30 min: (1) ask the main Worker to refresh the PLA intel it scrapes through the Taiwan-placed `pla-intel` Worker (Taiwan MND daily bulletin + Japan Joint Staff release list);
# (2) download the new Joint Staff PDFs, run `pdftotext` here (a Worker cannot decode them: compressed CID fonts + 10 ms CPU), parse hull numbers and POST them to /api/pla/ingest.
# No box involved. The Worker's own cron (*/2) also refreshes MND/Joint Staff titles, so a late/skipped GitHub run only delays the PDF-derived hull numbers.
# Fails loudly (red run + e-mail) when the refresh/ingest errors, the Joint Staff index is > 3 h stale, or the newest MND bulletin is older than yesterday (Taipei).
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
concurrency:
  group: pla-intel
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pdftotext available
        run: command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils); pdftotext -v 2>&1 | head -1
      - name: Refresh + PDF details
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: node scripts/pla-intel-pdf.mjs
