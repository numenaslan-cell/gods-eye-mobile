name: collector
# Every ~5 min: (1) POST the placed Worker `mpb-fetcher` (Taiwan-placed Cloudflare Worker, see workers/mpb-fetcher/) which fetches Taiwan MPB AIS
# (~7,000 ships; MPB is unreachable from GitHub runners) and ingests it into the main Worker; (2) scripts/collect-once.mjs with MPB=0 does CWA + ~60 s of aisstream.
# GitHub cron is best-effort: measured 2026-11, "*/5" really starts every 40-75 min. What is NOT affected: MPB ships (mpb-fetcher has its own Cloudflare cron + the proxy watchdog) and CWA/USGS/EMSC/GFZ quakes (proxy cron, CWA S3 mirror).
# What IS affected: the aisstream feed and the CWA REST backup. Mitigations: (1) the proxy's Cloudflare cron calls workflow_dispatch on this workflow when the collector has been silent for 10 min -- only active when the Worker secret GH_DISPATCH_TOKEN
# (fine-grained PAT, repo numenaslan-cell/gods-eye-mobile, Actions: read & write) exists; (2) the UI shows how old the aisstream data is (/api/ships aisAgeSec) and never depends on it. Dispatch is throttled to 1 per 15 min. The run FAILS (red + e-mail from GitHub) when mpb-fetcher answers
# non-2xx / 0 ships / ingest not ok, the Worker's mpbAgeSec is stale, CWA fails, an ingest route answers non-2xx, or /api/ships|/api/quakes timestamps did not advance.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [collect]
concurrency:
  group: collector
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # global WebSocket needs Node >= 22 (Node 20 has none without a flag)
      - name: MPB via placed Worker (mpb-fetcher)
        id: mpb
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          FETCHER_URL: https://mpb-fetcher.numenaslan.workers.dev
        run: |
          set -uo pipefail
          echo "run started $(date -u +%FT%TZ)"
          code=000
          for i in 1 2 3; do
            code=$(curl -sS -m 60 -o mpb.json -w '%{http_code}' -X POST -H "X-Trigger: gha-$GITHUB_EVENT_NAME" -H "Authorization: Bearer $INGEST_TOKEN" "$FETCHER_URL/run" || echo 000)
            echo "attempt $i: HTTP $code"; cat mpb.json 2>/dev/null; echo
            [ "$code" = 200 ] && break
            sleep $((i * 5))
          done
          if [ "$code" != 200 ]; then echo "::error::mpb-fetcher answered HTTP $code (non-2xx) after 3 attempts"; exit 1; fi
          ships=$(jq -r '.ships // 0' mpb.json); ok=$(jq -r '.ok' mpb.json); applied=$(jq -r '.ingest.mpb // 0' mpb.json)
          if [ "$ok" != "true" ] || [ "$ships" -lt 1000 ] || [ "$applied" -lt 1000 ]; then echo "::error::mpb-fetcher unhealthy: ok=$ok ships=$ships applied=$applied (expected ~7000)"; exit 1; fi
          base="${WORKER_URL:-https://gods-eye-opensky-proxy.numenaslan.workers.dev}"; base="${base%/}"
          age=$(curl -sS -m 30 -H 'Cache-Control: no-cache' "$base/api/ships?_=$(date +%s)" | jq -r '.mpbAgeSec // 99999')
          echo "Worker mpbAgeSec=$age"
          if [ "$age" -gt 300 ]; then echo "::error::Worker mpbAgeSec=$age (> 300 s) after ingest"; exit 1; fi
          { echo "### MPB via placed Worker"; echo '```json'; jq -c . mpb.json; echo '```'; echo "Worker mpbAgeSec=$age"; } >> "$GITHUB_STEP_SUMMARY"
      - name: CWA + aisstream (collect-once, MPB=0)
        if: ${{ !cancelled() }}   # still run when the MPB step failed so CWA/aisstream stay fresh; the job is red either way
        env:
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          AIS_SEC: "300"              # ~300 vessels per 120 s over the wide box (2026-11-05): listen 5 min (collect-once reconnects on early 1006 drops)
          BBOX: "0,105,45,145"        # fallback single box if AIS_BOXES unset
          CORE_BBOX: "18,114,29,128"  # Taiwan core: preferred when the upload is capped
          YS_BBOX: "31,117,41,127"    # Yellow Sea + Bohai: reserved ~25% of the upload cap
          AIS_BOXES: "18,114,29,128;31,117,41,127;0,105,20,125;20,125,35,145;35,125,45,145"  # split boxes so Yellow Sea is not starved by one huge subscription
          MPB: "0"   # MPB is fetched by the placed Worker above (mpbais.motcmpb.gov.tw times out from GitHub runners)
        run: node scripts/collect-once.mjs
      - name: Health gate (ships present, MPB fresh, bindings intact)
        if: ${{ !cancelled() }}   # runs even when an earlier step failed; any problem here turns the run red (GitHub e-mails the owner)
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
        run: |
          set -uo pipefail
          base="${WORKER_URL:-https://gods-eye-opensky-proxy.numenaslan.workers.dev}"; base="${base%/}"
          code=$(curl -sS -m 30 -H 'Cache-Control: no-cache' -o health.json -w '%{http_code}' "$base/api/health?_=$(date +%s)" || echo 000)
          cat health.json 2>/dev/null; echo
          count=$(jq -r '.ships.count // 0' health.json 2>/dev/null || echo 0); age=$(jq -r '.ships.mpbAgeSec // 99999' health.json 2>/dev/null || echo 99999)
          missing=$(jq -r '(.missingBindings // []) | join(",")' health.json 2>/dev/null || echo "?")
          { echo "### Health gate"; echo "HTTP $code · ships=$count · mpbAgeSec=$age · missing bindings: ${missing:-none}"; } >> "$GITHUB_STEP_SUMMARY"
          fail=0
          if [ "$count" -lt 1 ]; then echo "::error::/api/health: ships.count=0 (the map would be empty)"; fail=1; fi
          if [ "$age" -gt 900 ]; then echo "::error::/api/health: MPB data is stale (mpbAgeSec=$age > 900)"; fail=1; fi
          if [ -n "$missing" ]; then echo "::error::/api/health: Worker bindings/secrets missing after a deploy: $missing"; fail=1; fi
          if [ "$code" != 200 ]; then echo "::error::/api/health answered HTTP $code"; fail=1; fi
          exit $fail
